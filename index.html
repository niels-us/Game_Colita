<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>COLA LEGENDS</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      margin: 0;
      touch-action: none;
      /* Previene el zoom/scroll */
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      overflow: hidden;
      background: linear-gradient(to top, #87CEEB 70%, #91a5d9 100%);
    }

    h1 {
      position: absolute;
      top: 10px;
      left: 0;
      width: 100%;
      margin: 0;
      text-align: center;
      /* AJUSTE: Fuente responsiva */
      font-size: min(8vw, 40px);
      color: blue;
      text-shadow:
        -2px -2px 0 yellow,
        2px -2px 0 yellow,
        -2px 2px 0 yellow,
        2px 2px 0 yellow;
      z-index: 100;
      pointer-events: none;
      top: 5vh;
      /* Un poco más abajo */
    }

    /* Mundo (escenario grande) */
    .mundo {
      position: absolute;
      left: 0;
      top: 0;
      width: 3000px;
      /* ancho total del mundo */
      height: 100vh;
      transform: translateX(0);
      z-index: 1;
      will-change: transform;
      /* Hint para el navegador */
    }

    /* Nubes */
    .nube {
      position: absolute;
      background: white;
      border-radius: 50%;
      opacity: 0.95;
      z-index: 20;
    }

    .nube::before,
    .nube::after {
      content: "";
      position: absolute;
      background: white;
      border-radius: 50%;
    }

    .nube.pequeña {
      width: 60px;
      height: 40px;
    }

    .nube.pequeña::before {
      width: 30px;
      height: 30px;
      left: -15px;
      top: 5px;
    }

    .nube.pequeña::after {
      width: 30px;
      height: 30px;
      right: -15px;
      top: 5px;
    }

    /* Suelo */
    .suelo {
      position: absolute;
      left: 0;
      bottom: 0;
      width: 100%;
      height: 120px;
      background: linear-gradient(to top, #228B22, #32CD32);
      border-top: 5px solid #1a6b1a;
      z-index: 10;
    }

    /* Obstaculos */
    .obstaculo {
      position: absolute;
      background: #8B0000;
      /* Rojo oscuro peligroso */
      border: 2px solid #5a0000;
      z-index: 15;
      /* Optimización móvil: menos sombras complejas */
      box-shadow: 2px 2px 0px rgba(0, 0, 0, 0.5);
      will-change: transform;
    }

    .obstaculo::after {
      content: "!";
      color: white;
      position: absolute;
      width: 100%;
      text-align: center;
      top: 50%;
      transform: translateY(-50%);
      font-weight: bold;
      font-family: monospace;
    }

    /* Personaje */
    .personaje {
      position: fixed;
      width: 100px;
      height: 100px;
      z-index: 200;
      pointer-events: none;
      /* Optimización: usar transform en lugar de left/top siempre que sea posible */
      will-change: transform;
      /* Eliminamos transform-origin por defecto para control manual simple */
    }

    .personaje img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    /* --- CONTROLES MÓVILES --- */
    #controles {
      position: fixed;
      bottom: 10px;
      left: 0;
      width: 100%;
      padding: 10px;
      z-index: 500;
      /* Asegura que estén por encima de todo */
      display: flex;
      justify-content: space-between;
      pointer-events: none;
      /* Permite clicks en los botones, pero no en el contenedor */
    }

    .boton {
      width: 15vmin;
      /* Escala según el lado más pequeño de la pantalla */
      height: 15vmin;
      max-width: 80px;
      max-height: 80px;
      min-width: 50px;
      min-height: 50px;
      background: rgba(0, 0, 0, 0.6);
      border: 3px solid white;
      border-radius: 50%;
      color: white;
      font-size: 6vmin;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
      pointer-events: all;
      /* Hace que el botón sea clickeable/táctil */
      touch-action: manipulation;
      /* Optimiza para interacción táctil */
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
    }

    .boton:active {
      background: rgba(255, 255, 255, 0.8);
      color: black;
    }

    #dpad {
      display: flex;
      gap: 10px;
      margin-left: 20px;
    }

    #salto {
      margin-right: 20px;
    }

    /* Pequeño ajuste para pantallas más pequeñas */
    @media (max-width: 600px) {
      .boton {
        width: 50px;
        height: 50px;
        font-size: 20px;
      }
    }

    #ui-stats {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 1000;
      pointer-events: none;
      font-family: Arial, sans-serif;
      font-weight: bold;
      color: white;
      text-shadow: 2px 2px 0 #000;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .ui-text {
      font-size: min(6vw, 30px);
    }

    #ui-vidas {
      color: #ff4444;
    }

    /* Enemigo Cola-Pick */
    .enemigo {
      position: absolute;
      width: 80px;
      height: 80px;
      z-index: 100;
      pointer-events: none;
      /* Animación simple de flotación o caminar si se quiere */
    }

    .enemigo img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* Clase de parpadeo para invulnerabilidad */
    .parpadeo {
      animation: blink 0.2s infinite;
    }

    @keyframes blink {
      0% {
        opacity: 1;
      }

      50% {
        opacity: 0.3;
      }

      100% {
        opacity: 1;
      }
    }

    /* Modal Game Over */
    #modal-gameover {
      display: none;
      /* Hidden by default */
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      /* Fondo oscuro semitransparente */
      z-index: 2000;
      /* Encima de todo */
      justify-content: center;
      align-items: center;
      flex-direction: column;
      color: white;
      text-align: center;
    }

    #modal-gameover h2 {
      font-size: min(10vw, 60px);
      margin-bottom: 20px;
      color: #ff4444;
      text-shadow: 3px 3px 0 #000;
      font-family: 'Arial Black', sans-serif;
    }

    #modal-gameover p {
      font-size: min(6vw, 30px);
      margin-bottom: 30px;
      color: #fff;
      text-shadow: 1px 1px 0 #000;
    }

    #modal-gameover button {
      padding: 15px 40px;
      font-size: min(6vw, 24px);
      background: #4CAF50;
      color: white;
      border: 3px solid #fff;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.5);
      font-weight: bold;
      transition: transform 0.1s;
    }

    #modal-gameover button:active {
      transform: scale(0.95);
    }
  </style>
</head>

<body>



  <h1>COLA LEGENDS</h1>

  <div id="ui-stats">
    <div id="ui-world" class="ui-text">WORLD: 1</div>
    <div id="ui-nivel" class="ui-text">LEVEL: 1</div>
    <div id="ui-score" class="ui-text">PTS: 0</div>
    <div id="ui-vidas" class="ui-text">❤❤❤❤❤</div>
  </div>

  <div class="mundo" id="mundo">
    <div class="nube pequeña" style="top: 80px; left: 100px;"></div>
    <div class="nube pequeña" style="top: 150px; left: 400px;"></div>
    <div class="nube pequeña" style="top: 60px; left: 700px;"></div>
    <div class="nube pequeña" style="top: 120px; left: 1200px;"></div>
    <div class="nube pequeña" style="top: 100px; left: 1600px;"></div>

    <div class="suelo"></div>
  </div>

  <div class="personaje" id="personaje">
    <img id="sprite" src="img/cola1.png" alt="Personaje">
  </div>

  <!-- Modal Game Over -->
  <div id="modal-gameover">
    <h2>GAME OVER</h2>
    <p>Puntuación: <span id="score-final">0</span></p>
    <button id="btn-restart">Volver a Jugar</button>
  </div>

  <div id="controles">
    <div id="dpad">
      <div class="boton" id="btnLeft">◀</div>
      <div class="boton" id="btnRight">▶</div>
    </div>
    <div id="salto">
      <div class="boton" id="btnAttack" style="margin-right: 15px; background: rgba(255, 0, 0, 0.6);">Z</div>
      <div class="boton" id="btnUp">▲</div>
    </div>
  </div>
  <script>
    // ELEMENTOS
    const mundo = document.getElementById('mundo');
    const personajeEl = document.getElementById('personaje');
    const sprite = document.getElementById('sprite');

    // ELEMENTOS DE CONTROL MÓVIL
    const btnLeft = document.getElementById('btnLeft');
    const btnRight = document.getElementById('btnRight');

    const btnUp = document.getElementById('btnUp');
    const btnAttack = document.getElementById('btnAttack');

    // --- VARIABLES GLOBALES DEL JUEGO ---
    // PERSONAJE
    let xWorld = 200;
    let y = 100;
    let velocidadY = 0;
    let enSuelo = true;
    let vidas = 5;
    let score = 0; // Puntuación
    let isDead = false; // Estado de muerte
    let isInvincible = false; // Estado de invulnerabilidad

    // ENEMIGOS
    let enemigos = [];
    const imgEnemigo = "img/cola-pick2.png";

    // CONFIG JUEGO
    const gravedad = 1;
    const fuerzaSalto = 18;
    const velocidadX = 6;
    const alturaSuelo = 100;
    const anchoPersonaje = 100;

    // ANIMACIÓN
    let animTick = 0;
    let facing = 1;

    // GENERACIÓN DE NIVELES
    let world = 1;
    let nivel = 1;
    let elementosObstaculos = [];

    // SPRITES (ajusta rutas si es necesario)
    const imgParado = "img/cola.png";
    const imgCam1 = "img/cola1.png";
    const imgCam2 = "img/cola2.png";

    const imgSaltar = "img/cola3.png";
    const imgAtaque = "img/cola4.png"; // Nueva imagen de ataque
    let isAttacking = false; // Estado de ataque

    // GENERACIÓN DE NIVELES Y OBSTÁCULOS
    // (Variables definidas arriba)

    function randomInt(min, max) {
      return Math.floor(Math.random() * (max - min + 1) + min);
    }

    function getRandomColor() {
      const letters = '0123456789ABCDEF';
      let color = '#';
      for (let i = 0; i < 6; i++) {
        color += letters[Math.floor(Math.random() * 16)];
      }
      return color;
    }

    function updateBackground() {
      // Generar dos colores aleatorios para un gradiente
      const c1 = getRandomColor();
      const c2 = getRandomColor();
      document.body.style.background = `linear-gradient(to top, ${c1} 70%, ${c2} 100%)`;
    }

    function iniciarNivel(nuevoNivel, nuevoWorld = false) {
      // Lógica de progresión
      // Si nuevoWorld es true, es porque forzamos cambio (inicio)
      // Si no, verificamos el ciclo de 10 niveles

      // Ajuste de variables globales
      if (nuevoNivel > 10) {
        nivel = 1;
        world++;
        nuevoWorld = true; // Flag para cambiar fondo
        playSound('level'); // Sonido extra motivador
      } else {
        nivel = nuevoNivel;
      }

      // 1. Actualizar UI
      const uiNivel = document.getElementById('ui-nivel');
      const uiWorld = document.getElementById('ui-world');
      if (uiNivel) uiNivel.innerText = 'LEVEL: ' + nivel;
      if (uiWorld) uiWorld.innerText = 'WORLD: ' + world;
      updateScoreUI();

      // 2. Si cambiamos de mundo, cambiamos fondo
      if (nuevoWorld) {
        updateBackground();
      }

      // 3. Limpiar obstáculos viejos
      elementosObstaculos.forEach(obj => obj.element.remove());
      elementosObstaculos = [];

      // 4. Generar nuevos obstáculos
      // Ajuste a 25 obstáculos fijos distribuidos aleatoriamente
      const cantidad = 18;
      const nivelColor = getRandomColor(); // Obstáculos color aleatorio siempre

      for (let i = 0; i < cantidad; i++) {
        // Posición X aleatoria (evitando el inicio 0-500 para no matar al jugador al spawnear)
        const posX = randomInt(500, 2800);
        const w = randomInt(40, 80);
        const h = randomInt(40, 100);

        const el = document.createElement('div');
        el.classList.add('obstaculo');
        el.style.width = w + 'px';
        el.style.height = h + 'px';
        el.style.left = posX + 'px';
        el.style.bottom = '120px';
        el.style.backgroundColor = nivelColor; // Color del nivel
        el.style.borderColor = "black";

        mundo.appendChild(el);
        elementosObstaculos.push({
          element: el,
          x: posX,
          y: 120,
          w: w,
          h: h,
          passed: false
        });
      }

      // 5. Generar nuevos enemigos
      enemigos.forEach(e => e.element.remove());
      enemigos = [];

      for (let i = 0; i < 4; i++) {
        // Spawnear en una posición aleatoria lejana pero transitable
        const enemyX = randomInt(1000, 2800);
        const enemyEl = document.createElement('div');
        enemyEl.classList.add('enemigo');
        enemyEl.innerHTML = `<img src="${imgEnemigo}" alt="Cola-Pick">`;
        enemyEl.style.left = enemyX + 'px';
        enemyEl.style.bottom = '120px'; // Sobre el suelo
        mundo.appendChild(enemyEl);

        enemigos.push({
          element: enemyEl,
          x: enemyX,
          y: 120,
          w: 80,
          h: 80,
          dir: (Math.random() > 0.5) ? 1 : -1, // Dirección inicial aleatoria
          speed: 2, // velocidad de patrulla
          isDead: false,
          velocityY: 0
        });
      }
    }





    // Iniciar juego: Nivel 1, y forzamos updateBackground (nuevoWorld=true implícito en lógica inicial si queremos, o manual)
    // Para que empiece con el color default (azul cielo) podemos no llamar updateBackground,
    // o llamarlo para que sea random desde el principio. El usuario dijo: "cada cambio de mundo ... cambia de color".
    // Asumiremos que el World 1 puede tener el color default o random. Lo haré random para consistencia.
    // O mejor: conservamos el azul para World 1 y cambiamos al pasar a World 2?
    // "al inicio del juego este en world 1 ... cada cambio de mundo cambia ... asi se aprecia el nuevo mundo"
    // Haremos que cambie desde ya para probar.
    iniciarNivel(1, false); // false para mantener el azul original al principio si se quiere, o true para random.
    // El usuario pide "cambia de forma aleatoria", dejaré el azul por defecto en CSS y solo cambiará al World 2.
    // PERO si quiere "apreciar el nuevo mundo", mejor que cambie siempre.

    // Voy a forzar un color inicial aleatorio para World 1 si el usuario quiere "sensación de mundos"
    // Pero el CSS tiene un bonito azul. Dejémoslo y que cambie al World 2.

    // CONFIG MUNDO
    let anchoMundo = 3000;
    let anchoPantalla = window.innerWidth;
    let desplazamientoMundo = 0;

    // AUDIO (Sintetizador simple para no depender de archivos externos)
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    // Helper para pantalla completa
    function tryFullScreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(e => console.log(e));
      }
    }

    function playSound(type) {
      if (audioCtx.state === 'suspended') audioCtx.resume();

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      if (type === 'jump') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(150, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(300, audioCtx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.1);
      } else if (type === 'bump') {
        // Sonido de golpe (cabeza contra bloque)
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(100, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.1);
      } else if (type === 'level') {
        // Sonido de victoria
        osc.type = 'sine';
        osc.frequency.setValueAtTime(400, audioCtx.currentTime);
        osc.frequency.linearRampToValueAtTime(800, audioCtx.currentTime + 0.1);
        osc.frequency.linearRampToValueAtTime(1200, audioCtx.currentTime + 0.3);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.6);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.6);
      } else if (type === 'gameover') {
        // Sonido de Game Over
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(200, audioCtx.currentTime);
        osc.frequency.linearRampToValueAtTime(50, audioCtx.currentTime + 0.8);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.8);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.8);
      } else if (type === 'gameover_long') {
        // Sonido MUY largo de derrota (caída)
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(400, audioCtx.currentTime);
        osc.frequency.linearRampToValueAtTime(100, audioCtx.currentTime + 2.5);

        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 2.5);

        osc.start();
        osc.stop(audioCtx.currentTime + 2.5);
      }
    }

    // --- MUSICA DE FONDO (Secuenciador Simple) ---
    let musicPlaying = false;
    let musicTimeout;

    // Una melodía más larga y variada (Estilo Mario Simple)
    const melody = [
      // Intro
      { f: 330, d: 0.2 }, { f: 330, d: 0.2 }, { f: 0, d: 0.2 }, { f: 330, d: 0.2 },
      { f: 0, d: 0.2 }, { f: 261, d: 0.2 }, { f: 330, d: 0.4 }, { f: 392, d: 0.4 },
      { f: 0, d: 0.4 }, { f: 196, d: 0.4 }, { f: 0, d: 0.4 },
      // Parte Principal
      { f: 261, d: 0.3 }, { f: 0, d: 0.15 }, { f: 196, d: 0.3 }, { f: 0, d: 0.15 }, { f: 164, d: 0.3 },
      { f: 0, d: 0.15 }, { f: 220, d: 0.3 }, { f: 246, d: 0.3 }, { f: 233, d: 0.15 }, { f: 220, d: 0.3 },
      { f: 196, d: 0.2 }, { f: 330, d: 0.2 }, { f: 392, d: 0.2 }, { f: 440, d: 0.2 },
      { f: 349, d: 0.2 }, { f: 392, d: 0.2 }, { f: 0, d: 0.2 }, { f: 330, d: 0.2 },
      { f: 261, d: 0.2 }, { f: 293, d: 0.2 }, { f: 246, d: 0.4 }, { f: 0, d: 0.2 },
      { f: 261, d: 0.3 }, { f: 0, d: 0.15 }, { f: 196, d: 0.3 }, { f: 0, d: 0.15 }, { f: 164, d: 0.3 },
      { f: 0, d: 0.15 }, { f: 220, d: 0.3 }, { f: 246, d: 0.3 }, { f: 233, d: 0.15 }, { f: 220, d: 0.3 },
      { f: 196, d: 0.2 }, { f: 330, d: 0.2 }, { f: 392, d: 0.2 }, { f: 440, d: 0.2 },
      { f: 349, d: 0.2 }, { f: 392, d: 0.2 }, { f: 0, d: 0.2 }, { f: 330, d: 0.2 },
      { f: 261, d: 0.2 }, { f: 293, d: 0.2 }, { f: 246, d: 0.4 }, { f: 0, d: 0.2 },
      { f: 261, d: 0.3 }, { f: 0, d: 0.15 }, { f: 196, d: 0.3 }, { f: 0, d: 0.15 }, { f: 164, d: 0.3 },
      { f: 0, d: 0.15 }, { f: 220, d: 0.3 }, { f: 246, d: 0.3 }, { f: 233, d: 0.15 }, { f: 220, d: 0.3 },
      { f: 196, d: 0.2 }, { f: 330, d: 0.2 }, { f: 392, d: 0.2 }, { f: 440, d: 0.2 },
      { f: 349, d: 0.2 }, { f: 392, d: 0.2 }, { f: 0, d: 0.2 }, { f: 330, d: 0.2 },
      { f: 2619, d: 1 }, { f: 293, d: 0.2 }, { f: 246, d: 0.4 }, { f: 0, d: 0.2 },
    ];
    let noteIndex = 0;

    function playMusicLoop() {
      if (!musicPlaying) return;

      const note = melody[noteIndex];
      noteIndex = (noteIndex + 1) % melody.length;

      // Calcular factor de velocidad basado en el nivel
      // Nivel 1 = 1.0, Nivel 2 = 1.1, etc...
      const speedFactor = 1 + (nivel - 1) * 0.1;
      const duration = note.d / speedFactor;

      if (note.f > 0) {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.type = 'square';
        osc.frequency.setValueAtTime(note.f, audioCtx.currentTime);
        // Volumen bajo para fondo
        gain.gain.setValueAtTime(0.03, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);

        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      }

      // Programar siguiente nota (tiempo ajustado)
      musicTimeout = setTimeout(playMusicLoop, duration * 1000);
    }

    function startMusic() {
      if (musicPlaying) return;
      if (audioCtx.state === 'suspended') audioCtx.resume();

      musicPlaying = true;
      playMusicLoop();
    }

    // Función Maestra de Interacción
    function handleInteraction() {
      startMusic();
      tryFullScreen();
    }



    // --- LÓGICA DE INPUT UNIFICADA ---
    const teclas = { ArrowLeft: false, ArrowRight: false, ArrowUp: false };

    // 1. Teclado
    window.addEventListener('keydown', e => {
      handleInteraction();
      if (e.code in teclas) teclas[e.code] = true;
    });
    window.addEventListener('keyup', e => { if (e.code in teclas) teclas[e.code] = false; });

    // 2. Táctil / Mouse
    function setKey(code, value) {
      if (value) handleInteraction();
      if (code in teclas) {
        teclas[code] = value;
      }
    }

    // Eventos para el botón Izquierda
    btnLeft.addEventListener('touchstart', (e) => { e.preventDefault(); setKey('ArrowLeft', true); });
    btnLeft.addEventListener('touchend', (e) => { e.preventDefault(); setKey('ArrowLeft', false); });
    btnLeft.addEventListener('mousedown', () => setKey('ArrowLeft', true));
    btnLeft.addEventListener('mouseup', () => setKey('ArrowLeft', false));

    // Eventos para el botón Derecha
    btnRight.addEventListener('touchstart', (e) => { e.preventDefault(); setKey('ArrowRight', true); });
    btnRight.addEventListener('touchend', (e) => { e.preventDefault(); setKey('ArrowRight', false); });
    btnRight.addEventListener('mousedown', () => setKey('ArrowRight', true));
    btnRight.addEventListener('mouseup', () => setKey('ArrowRight', false));

    // Eventos para el botón Saltar
    btnUp.addEventListener('touchstart', (e) => { e.preventDefault(); setKey('ArrowUp', true); });
    btnUp.addEventListener('touchend', (e) => { e.preventDefault(); setKey('ArrowUp', false); });
    btnUp.addEventListener('mousedown', () => setKey('ArrowUp', true));
    btnUp.addEventListener('mouseup', () => setKey('ArrowUp', false));

    // Eventos para el botón Ataque
    function performAttack() {
      if (isAttacking || isDead) return;
      isAttacking = true;
      // Reset después de 300ms (duración del golpe)
      setTimeout(() => {
        isAttacking = false;
      }, 300);
    }

    // Listener Tecla Z
    window.addEventListener('keydown', (e) => {
      if (e.key.toLowerCase() === 'z') {
        performAttack();
      }
    });

    btnAttack.addEventListener('touchstart', (e) => { e.preventDefault(); performAttack(); });
    btnAttack.addEventListener('mousedown', (e) => { e.preventDefault(); performAttack(); });
    // ---------------------------------

    window.addEventListener('resize', () => {
      anchoPantalla = window.innerWidth;
    });

    function actualizar() {
      // Si está muerto, ejecutar animación de muerte y salir
      if (isDead) {
        velocidadY += gravedad;
        y -= velocidadY;
        // Sin colisión con suelo, cae al vacío
        personajeEl.style.bottom = `${Math.round(y)}px`; // Actualizar visual Y
        // Mover solo Y visualmente en CSS transform si optimizamos, pero aquí simple:
        // Necesitamos actualizar el transform ya que es lo que se renderiza
        // Nota: screenX sigue siendo valido.
        personajeEl.style.transform = `translate3d(${Math.round(xWorld - desplazamientoMundo)}px, ${-Math.round(y)}px, 0)`;

        requestAnimationFrame(actualizar);
        return;
      }

      // movimiento horizontal en coordenadas del mundo (usa las mismas 'teclas' para teclado/táctil)
      if (teclas.ArrowLeft && !teclas.ArrowRight) { xWorld -= velocidadX; facing = -1; }
      if (teclas.ArrowRight && !teclas.ArrowLeft) { xWorld += velocidadX; facing = 1; }

      // Limites del mundo
      if (xWorld < 0) xWorld = 0;

      // Si llega al final derecho -> "Siguiente Nivel" (ciclo)
      if (xWorld > anchoMundo - anchoPersonaje) {
        playSound('level');
        xWorld = 200; // Reset posición
        // Avanzamos nivel (la logica de World está dentro)
        score += 100; // Puntos por nivel
        iniciarNivel(nivel + 1);
        console.log(`Nivel Completado! World ${world} - Nivel ${nivel}`);

        mundo.style.transition = 'none';
      }

      // salto
      if (teclas.ArrowUp && enSuelo) {
        playSound('jump');
        velocidadY = -fuerzaSalto;
        enSuelo = false;
      }

      // gravedad
      velocidadY += gravedad;
      y -= velocidadY;
      if (y <= alturaSuelo) {
        y = alturaSuelo;
        velocidadY = 0;
        enSuelo = true;
      }

      // --- DETECCIÓN DE COLISIONES ---
      // Personaje hitbox (AJUSTADO: Pixel Perfect)
      // Padding en 0 para que colisione EXACTAMENTE con la imagen visible
      const hitboxPaddingX = 0;
      const hitboxPaddingY = 0;

      const pjLeft = xWorld + hitboxPaddingX;
      const pjRight = xWorld + anchoPersonaje - hitboxPaddingX;
      const pjBottom = y;
      const pjTop = y + 100 - hitboxPaddingY;

      for (let obs of elementosObstaculos) {
        // DETECTAR SI LOGRAMOS PASAR EL OBSTÁCULO (Sumar puntos)
        if (!obs.passed && xWorld > obs.x + obs.w) {
          obs.passed = true;
          score += 10;
          updateScoreUI();
        }

        // Obstaculo hitbox (le damos un pequeño margen interno de 5px también)
        const obsPadding = 5;
        const obsLeft = obs.x + obsPadding;
        const obsRight = obs.x + obs.w - obsPadding;
        const obsBottom = obs.y + obsPadding;
        const obsTop = obs.y + obs.h - obsPadding;

        // AABB Collision (Axis-Aligned Bounding Box)
        // AABB Collision (Axis-Aligned Bounding Box)
        // Check if boxes overlap
        if (pjRight > obsLeft &&
          pjLeft < obsRight &&
          pjTop > obsBottom &&
          pjBottom < obsTop) {

          // COLISIÓN DETECTADA - Resolución de Físicas sólida

          // Calculamos cuánto penetra el personaje en el obstáculo por cada lado (overlaps)
          const overlapLeft = pjRight - obsLeft;
          const overlapRight = obsRight - pjLeft;
          const overlapTop = pjTop - obsBottom;    // Golpeando desde abajo (cabeza)
          const overlapBottom = obsTop - pjBottom;    // Cayendo desde arriba (pies)

          // Buscamos la penetración más pequeña para resolver por el camino más corto
          const minOverlap = Math.min(overlapLeft, overlapRight, overlapTop, overlapBottom);

          if (minOverlap === overlapLeft) {
            // Chocó por la izquierda (caminando a la derecha)
            // Resolvemos moviendo al personaje a la izquierda
            // xWorld + hitBoxPaddingX + width - overlap = borde.
            // Simplificado: empujamos xWorld hacia atrás
            xWorld -= overlapLeft;
          } else if (minOverlap === overlapRight) {
            // Chocó por la derecha (caminando a la izquierda)
            xWorld += overlapRight;
          } else if (minOverlap === overlapBottom) {
            // Cayó encima del obstáculo
            y += overlapBottom;
            velocidadY = 0;
            enSuelo = true; // Permite volver a saltar
          } else if (minOverlap === overlapTop) {
            // Golpeó el obstáculo con la cabeza saltando
            playSound('bump');
            y -= overlapTop;
            velocidadY = 0; // Detiene la subida
          }
        }
      }

      // animación sprite
      // animación sprite
      if (isAttacking) {
        sprite.src = imgAtaque;
      } else if (!enSuelo) {
        sprite.src = imgSaltar;
      } else if (teclas.ArrowLeft || teclas.ArrowRight) {
        animTick++;
        sprite.src = (animTick % 20 < 10) ? imgCam1 : imgCam2;
      } else {
        sprite.src = imgParado;
      }

      // --- Lógica de scroll del mundo ---
      // margenes donde empieza a desplazarse el mundo (porcentaje de pantalla)
      const leftMargin = anchoPantalla * 0.25;
      const rightMargin = anchoPantalla * 0.75;

      // posición del personaje en pantalla (relativa) antes de ajustar scroll
      let screenX = xWorld - desplazamientoMundo;

      // si pasa el margen derecho y el mundo puede desplazarse, movemos el mundo
      if (screenX > rightMargin && desplazamientoMundo < (anchoMundo - anchoPantalla)) {
        desplazamientoMundo = xWorld - rightMargin;
      }
      // si pasa el margen izquierdo y el mundo puede desplazarse a la izquierda
      if (screenX < leftMargin && desplazamientoMundo > 0) {
        desplazamientoMundo = xWorld - leftMargin;
      }

      // clamp final del desplazamiento
      desplazamientoMundo = Math.max(0, Math.min(desplazamientoMundo, Math.max(0, anchoMundo - anchoPantalla)));

      // recalcular screenX con desplazamiento final
      screenX = xWorld - desplazamientoMundo;

      // Aplicar transform al mundo (mueve nubes/suelo) usando translate3d para GPU
      mundo.style.transform = `translate3d(${-Math.round(desplazamientoMundo)}px, 0, 0)`;

      // Optimización: Mover personaje usando translate3d en lugar de left/bottom
      // left se elimina del CSS o se deja en 0, todo se maneja con transform
      // translate3d(x, y, 0).
      // OJO: 'y' en CSS translate Y positivo es hacia abajo.
      // Nuestra variable 'y' es "altura desde abajo".
      // Necesitamos calcular la posición TOP relativa al viewport.
      // alturaPantalla (vh) - y - alturaPersonaje

      // Para simplificar y no romper coordenadas:
      // Mantendremos 'bottom' en JS pero usaremos 'left' dentro del transform para el eje X
      // O mejor: usar translate3d completo.
      // ScreenX es la posición horizontal.
      // Y es la posición desde abajo.

      // Solución Híbrida segura:
      // Usamos 'left: 0' y 'bottom: 0' fijos en CSS (ajustar luego si hace falta)
      // Y aquí movemos todo con transform.

      // Por ahora, para asegurar compatibilidad con el código actual, solo optimizamos X con transform
      // y Y la dejamos o la optimizamos también.

      // Vamos a usar la técnica de: left se actualiza poco, transform mucho? No.
      // MEJOR: Position fixed + transform translate3d(screenX, -bottomOffset, 0)

      // Como 'personaje' tiene position: fixed
      // left: 0, bottom: 0 (lo forzaremos en línea abajo para asegurar)
      personajeEl.style.left = '0px';
      personajeEl.style.bottom = '0px';

      // Invertimos Y porque CSS translate Y positivo es hacia abajo.
      // Queremos que esté a 'y' pixeles del fondo.
      // Si bottom es 0, translate(0, -y) lo sube.
      personajeEl.style.transform = `translate3d(${Math.round(screenX)}px, ${-Math.round(y)}px, 0) scaleX(${facing})`;

      // --- LÓGICA ENEMIGOS (Patrulla simple) ---
      // --- Lógica ENEMIGOS (Patrulla simple) ---
      for (let i = enemigos.length - 1; i >= 0; i--) {
        let enemy = enemigos[i];

        if (enemy.isDead) {
          // Animación de muerte (salto y caída)
          enemy.velocityY += gravedad;
          enemy.y -= enemy.velocityY;
          enemy.element.style.bottom = enemy.y + 'px';

          // Eliminar si cae muy abajo
          if (enemy.y < -200) {
            enemy.element.remove();
            enemigos.splice(i, 1);
          }
          continue;
        }

        // Mover enemigo
        enemy.x += enemy.speed * enemy.dir;

        // Cambio de dirección simple
        if (Math.random() < 0.01) enemy.dir *= -1;
        if (enemy.x < 0) enemy.dir = 1;
        if (enemy.x > anchoMundo - 80) enemy.dir = -1;

        enemy.element.style.left = enemy.x + 'px';
        enemy.element.style.transform = `scaleX(${-enemy.dir})`;

        // COLISIÓN
        if (xWorld < enemy.x + enemy.w - 20 &&
          xWorld + anchoPersonaje > enemy.x + 20 &&
          y < enemy.y + enemy.h - 10 &&
          y + 100 > enemy.y + 10) {

          if (isAttacking) {
            enemy.isDead = true;
            enemy.velocityY = -15; // Salto inicial al morir
            playSound('bump');
          } else if (!isInvincible) {
            xWorld -= 100;
            playSound('bump');
            takeDamage();
          }
        }
      }

      requestAnimationFrame(actualizar);
    }

    function takeDamage() {
      if (isDead || isInvincible) return;

      isInvincible = true;
      personajeEl.classList.add('parpadeo');

      // 5 segundos de gracia
      setTimeout(() => {
        isInvincible = false;
        personajeEl.classList.remove('parpadeo');
      }, 5000);

      vidas--;
      updateLivesUI();
      document.body.style.backgroundColor = "red"; // Flash rojo
      setTimeout(updateBackground, 100);

      if (vidas <= 0) {
        triggerGameOver();
      }
    }

    function triggerGameOver() {
      isDead = true;
      playSound('gameover_long');

      // Salto de muerte
      velocidadY = -15; // Salto inicial
      enSuelo = false;

      // Esperar a que caiga (timeout simple o check de Y)
      setTimeout(() => {
        showGameOverModal();
      }, 2000);
    }

    function showGameOverModal() {
      const modal = document.getElementById('modal-gameover');
      const scoreFinal = document.getElementById('score-final');
      if (scoreFinal) scoreFinal.innerText = score;
      modal.style.display = 'flex';
    }

    // Botón reiniciar
    document.getElementById('btn-restart').addEventListener('click', () => {
      document.getElementById('modal-gameover').style.display = 'none';
      isDead = false;
      vidas = 5;
      score = 0;
      world = 1;
      nivel = 1;
      xWorld = 200;
      y = 100;
      velocidadY = 0;
      updateLivesUI();
      updateScoreUI();
      iniciarNivel(1, true);
    });

    function updateLivesUI() {
      const uiVidas = document.getElementById('ui-vidas');
      let corazones = "";
      for (let i = 0; i < vidas; i++) corazones += "❤";
      if (uiVidas) uiVidas.innerText = corazones;
    }

    function updateScoreUI() {
      const uiScore = document.getElementById('ui-score');
      if (uiScore) uiScore.innerText = 'PTS: ' + score;
    }
    //ajuse
    // iniciargit
    // Prueba
    actualizar();
  </script>
</body>
