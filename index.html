<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>COLA LEGENDS</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      margin: 0;
      touch-action: none;
      /* Previene el zoom/scroll */
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      overflow: hidden;
      background: linear-gradient(to top, #87CEEB 70%, #91a5d9 100%);
    }

    h1 {
      position: absolute;
      top: 10px;
      left: 0;
      width: 100%;
      margin: 0;
      text-align: center;
      /* AJUSTE: Fuente responsiva */
      font-size: min(8vw, 40px);
      color: blue;
      text-shadow:
        -2px -2px 0 yellow,
        2px -2px 0 yellow,
        -2px 2px 0 yellow,
        2px 2px 0 yellow;
      z-index: 100;
      pointer-events: none;
      top: 5vh;
      /* Un poco más abajo */
    }

    /* Mundo (escenario grande) */
    .mundo {
      position: absolute;
      left: 0;
      top: 0;
      width: 3000px;
      /* ancho total del mundo */
      height: 100vh;
      transform: translateX(0);
      z-index: 1;
    }

    /* Nubes */
    .nube {
      position: absolute;
      background: white;
      border-radius: 50%;
      opacity: 0.95;
      z-index: 20;
    }

    .nube::before,
    .nube::after {
      content: "";
      position: absolute;
      background: white;
      border-radius: 50%;
    }

    .nube.pequeña {
      width: 60px;
      height: 40px;
    }

    .nube.pequeña::before {
      width: 30px;
      height: 30px;
      left: -15px;
      top: 5px;
    }

    .nube.pequeña::after {
      width: 30px;
      height: 30px;
      right: -15px;
      top: 5px;
    }

    /* Suelo */
    .suelo {
      position: absolute;
      left: 0;
      bottom: 0;
      width: 100%;
      height: 120px;
      background: linear-gradient(to top, #228B22, #32CD32);
      border-top: 5px solid #1a6b1a;
      z-index: 10;
    }

    /* Obstaculos */
    .obstaculo {
      position: absolute;
      background: #8B0000;
      /* Rojo oscuro peligroso */
      border: 2px solid #5a0000;
      z-index: 15;
      box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.5);
    }

    .obstaculo::after {
      content: "!";
      color: white;
      position: absolute;
      width: 100%;
      text-align: center;
      top: 50%;
      transform: translateY(-50%);
      font-weight: bold;
      font-family: monospace;
    }

    /* Personaje */
    .personaje {
      position: fixed;
      width: 100px;
      height: 100px;
      z-index: 200;
      pointer-events: none;
      transform-origin: center;
    }

    .personaje img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    /* --- CONTROLES MÓVILES --- */
    #controles {
      position: fixed;
      bottom: 10px;
      left: 0;
      width: 100%;
      padding: 10px;
      z-index: 500;
      /* Asegura que estén por encima de todo */
      display: flex;
      justify-content: space-between;
      pointer-events: none;
      /* Permite clicks en los botones, pero no en el contenedor */
    }

    .boton {
      width: 15vmin;
      /* Escala según el lado más pequeño de la pantalla */
      height: 15vmin;
      max-width: 80px;
      max-height: 80px;
      min-width: 50px;
      min-height: 50px;
      background: rgba(0, 0, 0, 0.6);
      border: 3px solid white;
      border-radius: 50%;
      color: white;
      font-size: 6vmin;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
      pointer-events: all;
      /* Hace que el botón sea clickeable/táctil */
      touch-action: manipulation;
      /* Optimiza para interacción táctil */
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
    }

    .boton:active {
      background: rgba(255, 255, 255, 0.8);
      color: black;
    }

    #dpad {
      display: flex;
      gap: 10px;
      margin-left: 20px;
    }

    #salto {
      margin-right: 20px;
    }

    /* Pequeño ajuste para pantallas más pequeñas */
    @media (max-width: 600px) {
      .boton {
        width: 50px;
        height: 50px;
        font-size: 20px;
      }
    }

    #ui-nivel {
      position: fixed;
      top: 20px;
      left: 20px;
      font-size: min(6vw, 30px);
      /* Responsivo */
      font-weight: bold;
      color: white;
      text-shadow: 2px 2px 0 #000;
      z-index: 1000;
      font-family: Arial, sans-serif;
    }

    /* Ocultar controles en PC si se desea, o mostrarlos siempre */
    @media (hover: hover) and (pointer: fine) {
      /* Opcional: Podríamos ocultar botones en PC, pero 
          los dejaremos para pruebas fáciles con mouse */
    }
  </style>
</head>

<body>
  <h1>COLA LEGENDS</h1>
  <div id="ui-nivel">NIVEL: 1</div>

  <div class="mundo" id="mundo">
    <div class="nube pequeña" style="top: 80px; left: 100px;"></div>
    <div class="nube pequeña" style="top: 150px; left: 400px;"></div>
    <div class="nube pequeña" style="top: 60px; left: 700px;"></div>
    <div class="nube pequeña" style="top: 120px; left: 1200px;"></div>
    <div class="nube pequeña" style="top: 100px; left: 1600px;"></div>

    <div class="suelo"></div>
  </div>

  <div class="personaje" id="personaje">
    <img id="sprite" src="img/cola1.png" alt="Personaje">
  </div>

  <div id="controles">
    <div id="dpad">
      <div class="boton" id="btnLeft">◀</div>
      <div class="boton" id="btnRight">▶</div>
    </div>
    <div id="salto">
      <div class="boton" id="btnUp">▲</div>
    </div>
  </div>
  <script>
    // ELEMENTOS
    const mundo = document.getElementById('mundo');
    const personajeEl = document.getElementById('personaje');
    const sprite = document.getElementById('sprite');

    // ELEMENTOS DE CONTROL MÓVIL
    const btnLeft = document.getElementById('btnLeft');
    const btnRight = document.getElementById('btnRight');
    const btnUp = document.getElementById('btnUp');

    // SPRITES (ajusta rutas si es necesario)
    const imgParado = "img/cola.png";
    const imgCam1 = "img/cola1.png";
    const imgCam2 = "img/cola2.png";
    const imgSaltar = "img/cola3.png";

    // GENERACIÓN DE NIVELES Y OBSTÁCULOS
    let nivel = 1;
    let elementosObstaculos = [];

    function randomInt(min, max) {
      return Math.floor(Math.random() * (max - min + 1) + min);
    }

    function getRandomColor() {
      const letters = '0123456789ABCDEF';
      let color = '#';
      for (let i = 0; i < 6; i++) {
        color += letters[Math.floor(Math.random() * 16)];
      }
      return color;
    }

    function iniciarNivel(n) {
      // 1. Actualizar UI
      nivel = n;
      const ui = document.getElementById('ui-nivel');
      if (ui) ui.innerText = 'NIVEL: ' + nivel;

      // 2. Limpiar obstáculos viejos
      elementosObstaculos.forEach(obj => obj.element.remove());
      elementosObstaculos = [];

      // 3. Generar nuevos obstáculos
      // Cantidad aumenta con el nivel, color aleatorio por nivel
      const cantidad = 4 + nivel;
      const nivelColor = getRandomColor();

      for (let i = 0; i < cantidad; i++) {
        // Posición X aleatoria (evitando el inicio 0-500 para no matar al jugador al spawnear)
        const posX = randomInt(500, 2800);
        const w = randomInt(40, 80);
        const h = randomInt(40, 100);

        const el = document.createElement('div');
        el.classList.add('obstaculo');
        el.style.width = w + 'px';
        el.style.height = h + 'px';
        el.style.left = posX + 'px';
        el.style.bottom = '120px';
        el.style.backgroundColor = nivelColor; // Color del nivel
        el.style.borderColor = "black";

        mundo.appendChild(el);
        elementosObstaculos.push({
          element: el,
          x: posX,
          y: 120,
          w: w,
          h: h
        });
      }
    }

    // Iniciar primer nivel
    iniciarNivel(1);

    // CONFIG MUNDO
    let anchoMundo = 3000;
    let anchoPantalla = window.innerWidth;
    let desplazamientoMundo = 0;

    // AUDIO (Sintetizador simple para no depender de archivos externos)
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playSound(type) {
      if (audioCtx.state === 'suspended') audioCtx.resume();

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      if (type === 'jump') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(150, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(300, audioCtx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.1);
      } else if (type === 'bump') {
        // Sonido de golpe (cabeza contra bloque)
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(100, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.1);
      } else if (type === 'level') {
        // Sonido de victoria
        osc.type = 'sine';
        osc.frequency.setValueAtTime(400, audioCtx.currentTime);
        osc.frequency.linearRampToValueAtTime(800, audioCtx.currentTime + 0.1);
        osc.frequency.linearRampToValueAtTime(1200, audioCtx.currentTime + 0.3);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.6);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.6);
      }
    }

    // --- MUSICA DE FONDO (Secuenciador Simple) ---
    let musicPlaying = false;
    let musicTimeout;

    // Una melodía más larga y variada (Estilo Mario Simple)
    const melody = [
      // Intro
      { f: 330, d: 0.2 }, { f: 330, d: 0.2 }, { f: 0, d: 0.2 }, { f: 330, d: 0.2 },
      { f: 0, d: 0.2 }, { f: 261, d: 0.2 }, { f: 330, d: 0.4 }, { f: 392, d: 0.4 },
      { f: 0, d: 0.4 }, { f: 196, d: 0.4 }, { f: 0, d: 0.4 },
      // Parte Principal
      { f: 261, d: 0.3 }, { f: 0, d: 0.15 }, { f: 196, d: 0.3 }, { f: 0, d: 0.15 }, { f: 164, d: 0.3 },
      { f: 0, d: 0.15 }, { f: 220, d: 0.3 }, { f: 246, d: 0.3 }, { f: 233, d: 0.15 }, { f: 220, d: 0.3 },
      { f: 196, d: 0.2 }, { f: 330, d: 0.2 }, { f: 392, d: 0.2 }, { f: 440, d: 0.2 },
      { f: 349, d: 0.2 }, { f: 392, d: 0.2 }, { f: 0, d: 0.2 }, { f: 330, d: 0.2 },
      { f: 261, d: 0.2 }, { f: 293, d: 0.2 }, { f: 246, d: 0.4 }, { f: 0, d: 0.2 },
      { f: 261, d: 0.3 }, { f: 0, d: 0.15 }, { f: 196, d: 0.3 }, { f: 0, d: 0.15 }, { f: 164, d: 0.3 },
      { f: 0, d: 0.15 }, { f: 220, d: 0.3 }, { f: 246, d: 0.3 }, { f: 233, d: 0.15 }, { f: 220, d: 0.3 },
      { f: 196, d: 0.2 }, { f: 330, d: 0.2 }, { f: 392, d: 0.2 }, { f: 440, d: 0.2 },
      { f: 349, d: 0.2 }, { f: 392, d: 0.2 }, { f: 0, d: 0.2 }, { f: 330, d: 0.2 },
      { f: 261, d: 0.2 }, { f: 293, d: 0.2 }, { f: 246, d: 0.4 }, { f: 0, d: 0.2 },
      { f: 261, d: 0.3 }, { f: 0, d: 0.15 }, { f: 196, d: 0.3 }, { f: 0, d: 0.15 }, { f: 164, d: 0.3 },
      { f: 0, d: 0.15 }, { f: 220, d: 0.3 }, { f: 246, d: 0.3 }, { f: 233, d: 0.15 }, { f: 220, d: 0.3 },
      { f: 196, d: 0.2 }, { f: 330, d: 0.2 }, { f: 392, d: 0.2 }, { f: 440, d: 0.2 },
      { f: 349, d: 0.2 }, { f: 392, d: 0.2 }, { f: 0, d: 0.2 }, { f: 330, d: 0.2 },
      { f: 2619, d: 1 }, { f: 293, d: 0.2 }, { f: 246, d: 0.4 }, { f: 0, d: 0.2 },
    ];
    let noteIndex = 0;

    function playMusicLoop() {
      if (!musicPlaying) return;

      const note = melody[noteIndex];
      noteIndex = (noteIndex + 1) % melody.length;

      // Calcular factor de velocidad basado en el nivel
      // Nivel 1 = 1.0, Nivel 2 = 1.1, etc...
      const speedFactor = 1 + (nivel - 1) * 0.1;
      const duration = note.d / speedFactor;

      if (note.f > 0) {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.type = 'square';
        osc.frequency.setValueAtTime(note.f, audioCtx.currentTime);
        // Volumen bajo para fondo
        gain.gain.setValueAtTime(0.03, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);

        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      }

      // Programar siguiente nota (tiempo ajustado)
      musicTimeout = setTimeout(playMusicLoop, duration * 1000);
    }

    function startMusic() {
      if (musicPlaying) return;
      if (audioCtx.state === 'suspended') audioCtx.resume();

      musicPlaying = true;
      playMusicLoop();
    }

    // PERSONAJE
    let xWorld = 200;
    let y = 100;
    let velocidadY = 0;
    let enSuelo = true;

    const gravedad = 1;
    const fuerzaSalto = 18;
    const velocidadX = 6;
    const alturaSuelo = 100;
    const anchoPersonaje = 100; // Lo mantenemos aquí para la lógica de límites

    // animación
    let animTick = 0;
    let facing = 1; // 1 derecha, -1 izquierda

    // teclas (objeto que controla el estado de los inputs, ya sea teclado o táctil)
    const teclas = { ArrowLeft: false, ArrowRight: false, ArrowUp: false };

    // --- LÓGICA DE INPUT UNIFICADA ---

    // 1. Teclado
    window.addEventListener('keydown', e => {
      startMusic(); // Iniciar música al interactuar
      if (e.code in teclas) teclas[e.code] = true;
    });
    window.addEventListener('keyup', e => { if (e.code in teclas) teclas[e.code] = false; });

    // 2. Táctil / Mouse (Mantiene el botón presionado)

    function setKey(code, value) {
      if (value) startMusic(); // Iniciar música al tocar
      if (code in teclas) {
        teclas[code] = value;
      }
    }

    // Eventos para el botón Izquierda
    btnLeft.addEventListener('touchstart', (e) => { e.preventDefault(); setKey('ArrowLeft', true); });
    btnLeft.addEventListener('touchend', (e) => { e.preventDefault(); setKey('ArrowLeft', false); });
    btnLeft.addEventListener('mousedown', () => setKey('ArrowLeft', true));
    btnLeft.addEventListener('mouseup', () => setKey('ArrowLeft', false));

    // Eventos para el botón Derecha
    btnRight.addEventListener('touchstart', (e) => { e.preventDefault(); setKey('ArrowRight', true); });
    btnRight.addEventListener('touchend', (e) => { e.preventDefault(); setKey('ArrowRight', false); });
    btnRight.addEventListener('mousedown', () => setKey('ArrowRight', true));
    btnRight.addEventListener('mouseup', () => setKey('ArrowRight', false));

    // Eventos para el botón Saltar
    btnUp.addEventListener('touchstart', (e) => { e.preventDefault(); setKey('ArrowUp', true); });
    btnUp.addEventListener('touchend', (e) => { e.preventDefault(); setKey('ArrowUp', false); });
    btnUp.addEventListener('mousedown', () => setKey('ArrowUp', true));
    btnUp.addEventListener('mouseup', () => setKey('ArrowUp', false));
    // ---------------------------------

    window.addEventListener('resize', () => {
      anchoPantalla = window.innerWidth;
    });

    function actualizar() {
      // movimiento horizontal en coordenadas del mundo (usa las mismas 'teclas' para teclado/táctil)
      if (teclas.ArrowLeft && !teclas.ArrowRight) { xWorld -= velocidadX; facing = -1; }
      if (teclas.ArrowRight && !teclas.ArrowLeft) { xWorld += velocidadX; facing = 1; }

      // Limites del mundo
      if (xWorld < 0) xWorld = 0;

      // Si llega al final derecho -> "Siguiente Nivel" (ciclo)
      if (xWorld > anchoMundo - anchoPersonaje) {
        playSound('level');
        xWorld = 200; // Reset posición
        // Siguiente Nivel
        iniciarNivel(nivel + 1);
        console.log("¡Nivel Completado! Avanzando al nivel " + nivel);

        mundo.style.transition = 'none';
      }

      // salto
      if (teclas.ArrowUp && enSuelo) {
        playSound('jump');
        velocidadY = -fuerzaSalto;
        enSuelo = false;
      }

      // gravedad
      velocidadY += gravedad;
      y -= velocidadY;
      if (y <= alturaSuelo) {
        y = alturaSuelo;
        velocidadY = 0;
        enSuelo = true;
      }

      // --- DETECCIÓN DE COLISIONES ---
      // Personaje hitbox (AJUSTADO: Pixel Perfect)
      // Padding en 0 para que colisione EXACTAMENTE con la imagen visible
      const hitboxPaddingX = 0;
      const hitboxPaddingY = 0;

      const pjLeft = xWorld + hitboxPaddingX;
      const pjRight = xWorld + anchoPersonaje - hitboxPaddingX;
      const pjBottom = y;
      const pjTop = y + 100 - hitboxPaddingY;

      for (let obs of elementosObstaculos) {
        // Obstaculo hitbox (le damos un pequeño margen interno de 5px también)
        const obsPadding = 5;
        const obsLeft = obs.x + obsPadding;
        const obsRight = obs.x + obs.w - obsPadding;
        const obsBottom = obs.y + obsPadding;
        const obsTop = obs.y + obs.h - obsPadding;

        // AABB Collision (Axis-Aligned Bounding Box)
        // AABB Collision (Axis-Aligned Bounding Box)
        // Check if boxes overlap
        if (pjRight > obsLeft &&
          pjLeft < obsRight &&
          pjTop > obsBottom &&
          pjBottom < obsTop) {

          // COLISIÓN DETECTADA - Resolución de Físicas sólida

          // Calculamos cuánto penetra el personaje en el obstáculo por cada lado (overlaps)
          const overlapLeft = pjRight - obsLeft;
          const overlapRight = obsRight - pjLeft;
          const overlapTop = pjTop - obsBottom;    // Golpeando desde abajo (cabeza)
          const overlapBottom = obsTop - pjBottom;    // Cayendo desde arriba (pies)

          // Buscamos la penetración más pequeña para resolver por el camino más corto
          const minOverlap = Math.min(overlapLeft, overlapRight, overlapTop, overlapBottom);

          if (minOverlap === overlapLeft) {
            // Chocó por la izquierda (caminando a la derecha)
            // Resolvemos moviendo al personaje a la izquierda
            // xWorld + hitBoxPaddingX + width - overlap = borde.
            // Simplificado: empujamos xWorld hacia atrás
            xWorld -= overlapLeft;
          } else if (minOverlap === overlapRight) {
            // Chocó por la derecha (caminando a la izquierda)
            xWorld += overlapRight;
          } else if (minOverlap === overlapBottom) {
            // Cayó encima del obstáculo
            y += overlapBottom;
            velocidadY = 0;
            enSuelo = true; // Permite volver a saltar
          } else if (minOverlap === overlapTop) {
            // Golpeó el obstáculo con la cabeza saltando
            playSound('bump');
            y -= overlapTop;
            velocidadY = 0; // Detiene la subida
          }
        }
      }

      // animación sprite
      if (!enSuelo) {
        sprite.src = imgSaltar;
      } else if (teclas.ArrowLeft || teclas.ArrowRight) {
        animTick++;
        sprite.src = (animTick % 20 < 10) ? imgCam1 : imgCam2;
      } else {
        sprite.src = imgParado;
      }

      // --- Lógica de scroll del mundo ---
      // margenes donde empieza a desplazarse el mundo (porcentaje de pantalla)
      const leftMargin = anchoPantalla * 0.25;
      const rightMargin = anchoPantalla * 0.75;

      // posición del personaje en pantalla (relativa) antes de ajustar scroll
      let screenX = xWorld - desplazamientoMundo;

      // si pasa el margen derecho y el mundo puede desplazarse, movemos el mundo
      if (screenX > rightMargin && desplazamientoMundo < (anchoMundo - anchoPantalla)) {
        desplazamientoMundo = xWorld - rightMargin;
      }
      // si pasa el margen izquierdo y el mundo puede desplazarse a la izquierda
      if (screenX < leftMargin && desplazamientoMundo > 0) {
        desplazamientoMundo = xWorld - leftMargin;
      }

      // clamp final del desplazamiento
      desplazamientoMundo = Math.max(0, Math.min(desplazamientoMundo, Math.max(0, anchoMundo - anchoPantalla)));

      // recalcular screenX con desplazamiento final
      screenX = xWorld - desplazamientoMundo;

      // Aplicar transform al mundo (mueve nubes/suelo)
      mundo.style.transform = `translateX(${-Math.round(desplazamientoMundo)}px)`;

      // Posicionar personaje en pantalla (left = punto central del sprite)
      personajeEl.style.left = `${Math.round(screenX)}px`;
      personajeEl.style.bottom = `${Math.round(y)}px`;

      // Centro el sprite en el punto (uso translateX(-50%)) y lo volteo si hace falta
      // AJUSTE: Quitamos translateX(-50%) para que xWorld sea la ESQUINA IZQUIERDA EXACTA
      // Esto alinea la hitbox lógica con la visual.
      personajeEl.style.transform = `scaleX(${facing})`;

      requestAnimationFrame(actualizar);
    }
    //ajuse
    // iniciargit
    // Prueba
    actualizar();
  </script>
</body>

</html>
