<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>COLA LEGENDS</title>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; touch-action: none; /* Previene el zoom/scroll */ }
    body {
      font-family: Arial, Helvetica, sans-serif;
      overflow: hidden;
      background: linear-gradient(to top, #87CEEB 70%, #91a5d9 100%);
    }

    h1 {
      position: absolute;
      top: 10px;
      left: 0;
      width: 100%;
      margin: 0;
      text-align: center;
      /* AJUSTE: Reducción de fuente para móviles */
      font-size: 40px; 
      color: blue;
      text-shadow:
        -2px -2px 0 yellow,
         2px -2px 0 yellow,
        -2px  2px 0 yellow,
         2px  2px 0 yellow;
      z-index: 100;
      pointer-events: none;
    }

    /* Mundo (escenario grande) */
    .mundo {
      position: absolute;
      left: 0;
      top: 0;
      width: 3000px; /* ancho total del mundo */
      height: 100vh;
      transform: translateX(0);
      z-index: 1;
    }

    /* Nubes */
    .nube {
      position: absolute;
      background: white;
      border-radius: 50%;
      opacity: 0.95;
      z-index: 20;
    }
    .nube::before, .nube::after { content: ""; position: absolute; background: white; border-radius: 50%; }
    .nube.pequeña { width: 60px; height: 40px; }
    .nube.pequeña::before { width: 30px; height: 30px; left: -15px; top: 5px; }
    .nube.pequeña::after { width: 30px; height: 30px; right: -15px; top: 5px; }

    /* Suelo */
    .suelo {
      position: absolute;
      left: 0;
      bottom: 0;
      width: 100%;
      height: 120px;
      background: linear-gradient(to top, #228B22, #32CD32);
      border-top: 5px solid #1a6b1a;
      z-index: 10;
    }

    /* Personaje */
    .personaje {
      position: fixed;
      width: 100px;
      height: 100px;
      z-index: 200;
      pointer-events: none;
      transform-origin: center;
    }
    .personaje img { width: 100%; height: 100%; object-fit: contain; display:block; }

    /* --- CONTROLES MÓVILES --- */
    #controles {
      position: fixed;
      bottom: 10px;
      left: 0;
      width: 100%;
      padding: 10px;
      z-index: 500; /* Asegura que estén por encima de todo */
      display: flex;
      justify-content: space-between;
      pointer-events: none; /* Permite clicks en los botones, pero no en el contenedor */
    }

    .boton {
      width: 60px;
      height: 60px;
      background: rgba(0, 0, 0, 0.6);
      border: 3px solid white;
      border-radius: 50%;
      color: white;
      font-size: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
      pointer-events: all; /* Hace que el botón sea clickeable/táctil */
      touch-action: manipulation; /* Optimiza para interacción táctil */
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
    }
    
    .boton:active {
        background: rgba(255, 255, 255, 0.8);
        color: black;
    }

    #dpad {
      display: flex;
      gap: 10px;
      margin-left: 20px;
    }

    #salto {
      margin-right: 20px;
    }
    
    /* Pequeño ajuste para pantallas más pequeñas */
    @media (max-width: 600px) {
        .boton {
            width: 50px;
            height: 50px;
            font-size: 20px;
        }
    }
  </style>
</head>
<body>
  <h1>COLA LEGENDS</h1>

  <div class="mundo" id="mundo">
    <div class="nube pequeña" style="top: 80px; left: 100px;"></div>
    <div class="nube pequeña" style="top: 150px; left: 400px;"></div>
    <div class="nube pequeña" style="top: 60px; left: 700px;"></div>
    <div class="nube pequeña" style="top: 120px; left: 1200px;"></div>
    <div class="nube pequeña" style="top: 100px; left: 1600px;"></div>

    <div class="suelo"></div>
  </div>

  <div class="personaje" id="personaje">
    <img id="sprite" src="img/cola1.png" alt="Personaje">
  </div>

  <div id="controles">
    <div id="dpad">
      <div class="boton" id="btnLeft">◀</div>
      <div class="boton" id="btnRight">▶</div>
    </div>
    <div id="salto">
      <div class="boton" id="btnUp">▲</div>
    </div>
  </div>
  <script>
    // ELEMENTOS
    const mundo = document.getElementById('mundo');
    const personajeEl = document.getElementById('personaje');
    const sprite = document.getElementById('sprite');
    
    // ELEMENTOS DE CONTROL MÓVIL
    const btnLeft = document.getElementById('btnLeft');
    const btnRight = document.getElementById('btnRight');
    const btnUp = document.getElementById('btnUp');

    // SPRITES (ajusta rutas si es necesario)
    const imgParado = "img/cola.png";
    const imgCam1   = "img/cola1.png";
    const imgCam2   = "img/cola2.png";
    const imgSaltar = "img/cola3.png";

    // CONFIG MUNDO
    let anchoMundo = 3000;
    let anchoPantalla = window.innerWidth;
    let desplazamientoMundo = 0;

    // PERSONAJE
    let xWorld = 200;
    let y = 100;
    let velocidadY = 0;
    let enSuelo = true;

    const gravedad = 1;
    const fuerzaSalto = 18;
    const velocidadX = 6;
    const alturaSuelo = 100;
    const anchoPersonaje = 100; // Lo mantenemos aquí para la lógica de límites

    // animación
    let animTick = 0;
    let facing = 1; // 1 derecha, -1 izquierda

    // teclas (objeto que controla el estado de los inputs, ya sea teclado o táctil)
    const teclas = { ArrowLeft: false, ArrowRight: false, ArrowUp: false };
    
    // --- LÓGICA DE INPUT UNIFICADA ---

    // 1. Teclado
    window.addEventListener('keydown', e => { if (e.code in teclas) teclas[e.code] = true; });
    window.addEventListener('keyup',   e => { if (e.code in teclas) teclas[e.code] = false; });
    
    // 2. Táctil / Mouse (Mantiene el botón presionado)
    
    function setKey(code, value) {
        if (code in teclas) {
            teclas[code] = value;
        }
    }
    
    // Eventos para el botón Izquierda
    btnLeft.addEventListener('touchstart', (e) => { e.preventDefault(); setKey('ArrowLeft', true); });
    btnLeft.addEventListener('touchend', (e) => { e.preventDefault(); setKey('ArrowLeft', false); });
    btnLeft.addEventListener('mousedown', () => setKey('ArrowLeft', true));
    btnLeft.addEventListener('mouseup', () => setKey('ArrowLeft', false));

    // Eventos para el botón Derecha
    btnRight.addEventListener('touchstart', (e) => { e.preventDefault(); setKey('ArrowRight', true); });
    btnRight.addEventListener('touchend', (e) => { e.preventDefault(); setKey('ArrowRight', false); });
    btnRight.addEventListener('mousedown', () => setKey('ArrowRight', true));
    btnRight.addEventListener('mouseup', () => setKey('ArrowRight', false));

    // Eventos para el botón Saltar
    btnUp.addEventListener('touchstart', (e) => { e.preventDefault(); setKey('ArrowUp', true); });
    btnUp.addEventListener('touchend', (e) => { e.preventDefault(); setKey('ArrowUp', false); });
    btnUp.addEventListener('mousedown', () => setKey('ArrowUp', true));
    btnUp.addEventListener('mouseup', () => setKey('ArrowUp', false));
    // ---------------------------------

    window.addEventListener('resize', () => {
      anchoPantalla = window.innerWidth;
    });

    function actualizar() {
      // movimiento horizontal en coordenadas del mundo (usa las mismas 'teclas' para teclado/táctil)
      if (teclas.ArrowLeft && !teclas.ArrowRight) { xWorld -= velocidadX; facing = -1; }
      if (teclas.ArrowRight && !teclas.ArrowLeft) { xWorld += velocidadX; facing = 1; }

      // limitar X dentro del mundo
      xWorld = Math.max(0, Math.min(xWorld, anchoMundo - anchoPersonaje));

      // salto
      if (teclas.ArrowUp && enSuelo) {
        velocidadY = -fuerzaSalto;
        enSuelo = false;
      }

      // gravedad
      velocidadY += gravedad;
      y -= velocidadY;
      if (y <= alturaSuelo) {
        y = alturaSuelo;
        velocidadY = 0;
        enSuelo = true;
      }

      // animación sprite
      if (!enSuelo) {
        sprite.src = imgSaltar;
      } else if (teclas.ArrowLeft || teclas.ArrowRight) {
        animTick++;
        sprite.src = (animTick % 20 < 10) ? imgCam1 : imgCam2;
      } else {
        sprite.src = imgParado;
      }

      // --- Lógica de scroll del mundo ---
      // margenes donde empieza a desplazarse el mundo (porcentaje de pantalla)
      const leftMargin = anchoPantalla * 0.25;
      const rightMargin = anchoPantalla * 0.75;

      // posición del personaje en pantalla (relativa) antes de ajustar scroll
      let screenX = xWorld - desplazamientoMundo;

      // si pasa el margen derecho y el mundo puede desplazarse, movemos el mundo
      if (screenX > rightMargin && desplazamientoMundo < (anchoMundo - anchoPantalla)) {
        desplazamientoMundo = xWorld - rightMargin;
      }
      // si pasa el margen izquierdo y el mundo puede desplazarse a la izquierda
      if (screenX < leftMargin && desplazamientoMundo > 0) {
        desplazamientoMundo = xWorld - leftMargin;
      }

      // clamp final del desplazamiento
      desplazamientoMundo = Math.max(0, Math.min(desplazamientoMundo, Math.max(0, anchoMundo - anchoPantalla)));

      // recalcular screenX con desplazamiento final
      screenX = xWorld - desplazamientoMundo;

      // Aplicar transform al mundo (mueve nubes/suelo)
      mundo.style.transform = `translateX(${-Math.round(desplazamientoMundo)}px)`;

      // Posicionar personaje en pantalla (left = punto central del sprite)
      personajeEl.style.left = `${Math.round(screenX)}px`;
      personajeEl.style.bottom = `${Math.round(y)}px`;

      // Centro el sprite en el punto (uso translateX(-50%)) y lo volteo si hace falta
      personajeEl.style.transform = `translateX(-50%) scaleX(${facing})`;

      requestAnimationFrame(actualizar);
    }

    // iniciar
    // Prueba
    actualizar();
  </script>
</body>
</html>
